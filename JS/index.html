<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Flip 7 - Multijoueur</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { margin-bottom: 10px; }
        .row { margin: 8px 0; }
        input, button { padding: 6px 10px; }
        #log { border: 1px solid #ccc; padding: 10px; height: 220px; overflow-y: auto; white-space: pre-line; }
        #players { margin-top: 10px; }
        .player { padding: 6px; border: 1px solid #ddd; margin-bottom: 6px; }
        .active { background: #f0f8ff; border-color: #9cc; }
        .small { font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <h1>Flip 7 (Multijoueur)</h1>

    <div class="row">
        <label>Nombre de joueurs (2 à 6): </label>
        <input type="number" id="nbPlayers" value="2" min="2" max="6">
        <button id="startBtn">Démarrer</button>
    </div>

    <div class="row small">Règle simplifiée: on retourne une carte par tour. Si tu retournes un numéro déjà obtenu, tu perds la manche. Le premier à avoir 7 numéros différents gagne.</div>

    <div class="row">
        <button id="flipBtn" disabled>Retourner une carte</button>
        <button id="holdBtn" disabled>Je m'arrête</button>
        <button id="resetBtn" disabled>Recommencer</button>
    </div>

    <div id="players"></div>
    <h3>Journal</h3>
    <div id="log"></div>

    <script src="projet.js"></script>
</body>
</html>
